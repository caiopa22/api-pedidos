services:
  pedidos:
    build: .
    container_name: pedidos
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://root:root@postgres:5432/api_pedidos}
      POSTGRES_DB: ${POSTGRES_DB:-api_pedidos}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_pedidos}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-api_pedidos}"
      ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: